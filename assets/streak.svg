<svg xmlns="http://www.w3.org/2000/svg" width="400" height="230" viewBox="0 0 400 230" role="img" aria-label="Contribution streak">
  <title>Contribution streak</title>

  <style>
    /* ---------- Shared text styles ---------- */
    .m   { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; text-anchor: middle; }
    .num { font-size: 30px; font-weight: 700; fill: #000000; }                          /* big number */
    .lb  { font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #000000; }     /* label */
    .sub { font-size: 9px; letter-spacing: 0.3px; fill: #5c5c5c; }                      /* date range */

    /* ---------- Animations ---------- */
    .cu { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink {
      0%, 50%      { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }

    .fl {
      transform-box: fill-box;
      transform-origin: 50% 100%;    /* grow from the base of the flame */
      animation: flick 1.8s ease-in-out infinite;
    }
    @keyframes flick {
      0%, 100% { transform: scale(1, 1); }
      50%      { transform: scale(1.08, 1.14); }
    }
  </style>

  <!-- ========== Card: drop shadow + white body with border ========== -->
  <rect x="8" y="8" width="390" height="220" fill="#c4c4c4"/>
  <rect x="2" y="2" width="390" height="220" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ========== Column dividers ========== -->
  <line x1="135" y1="56" x2="135" y2="186" stroke="#5c5c5c" stroke-width="1"/>
  <line x1="265" y1="56" x2="265" y2="186" stroke="#5c5c5c" stroke-width="1"/>

  <!-- ========== Left: total contributions ========== -->
  <text class="m num" x="80" y="105">149</text>
  <text class="m lb"  x="80" y="162">CONTRIBUTIONS</text>
  <text class="m sub" x="80" y="178">SINCE JAN 30, 2026</text>

  <!-- ========== Center: current streak ========== -->
  <text class="m num" x="200" y="105">8</text>
  <text class="m lb"  x="200" y="162">CURRENT STREAK</text>
  <text class="m sub" x="200" y="178">OCT 11 - OCT 18</text>

  <!-- Streak ring (center 200,94 / r=36 / circumference ~226.2) -->
  <circle cx="200" cy="94" r="36" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-dasharray="180.2 46.0" transform="rotate(-53.4 200 94)"/>

  <!-- Flame icon (sits on top of the ring, white fill masks the ring behind it) -->
  <g transform="translate(190,44) scale(1.25)" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <g class="fl">
      <!-- Outer flame -->
      <path d="M8 0 C9.5 4 14 6.5 14 12 A6 6 0 0 1 2 12 C2 9 3.6 7.4 4.6 5.6 C5 7.2 5.8 8 6.8 8 C6.6 5 7 2.4 8 0 Z"/>
      <!-- Inner flame -->
      <path fill="none" d="M8 17 C6.4 17 5.4 15.8 5.4 14.4 C5.4 13 6.6 12.2 7.2 11 C8 12 10.6 12.8 10.6 14.4 C10.6 15.8 9.6 17 8 17 Z"/>
    </g>
  </g>

  <!-- ========== Right: longest streak ========== -->
  <text class="m num" x="320" y="105">8</text>
  <text class="m lb"  x="320" y="162">LONGEST STREAK</text>
  <text class="m sub" x="320" y="178">OCT 11 - OCT 18</text>
</svg>
