name: Update profile cards

on:
  schedule:
        - cron: "17 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/update-cards.yml"]

permissions: {}

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate cards
        run: python scripts/generate_cards.py --out "$RUNNER_TEMP/cards"
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}

      - name: Publish to the cards branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan cards-publish
          git rm -rf --quiet .
          cp "$RUNNER_TEMP"/cards/*.svg .
          git add -- *.svg
          git commit -q -m "chore: update profile cards"
          git push --force origin cards-publish:cards
