<svg xmlns="http://www.w3.org/2000/svg" width="400" height="78" viewBox="0 0 400 78" role="img" aria-label="EMAIL: kvrtrss@gmail.com">
  <title>EMAIL: kvrtrss@gmail.com</title>

  <style>
    .m { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

    /* Arrow nudges up-right, then rests */
    .a { animation: nudge 2.6s ease-in-out infinite; }
    @keyframes nudge {
      0%, 60%, 100% { transform: translate(0, 0); }
      80%           { transform: translate(3px, -3px); }
    }
  </style>

  <!-- ========== Card: drop shadow + white body with border ========== -->
  <rect x="8" y="8" width="390" height="68" fill="#c4c4c4"/>
  <rect x="2" y="2" width="390" height="68" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ========== Label ========== -->
  <text class="m" x="24" y="30" fill="#5c5c5c" font-size="11" letter-spacing="2">EMAIL</text>

  <!-- ========== Address ========== -->
  <text class="m" x="24" y="54" fill="#000000" font-size="17" font-weight="700">kvrtrss@gmail.com</text>

  <!-- ========== "Open" arrow (drawn as a path so it renders the same everywhere) ========== -->
  <!-- Outer group positions the arrow; inner group animates it -->
  <g transform="translate(348,30)" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <g class="a">
      <line x1="2" y1="18" x2="16" y2="4"/>
      <polyline points="6,4 16,4 16,14"/>
    </g>
  </g>
</svg>
