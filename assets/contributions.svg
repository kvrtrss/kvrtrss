<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img" aria-label="149 contributions in the last 12 months">
  <title>149 contributions in the last 12 months</title>

  <style>
    /* ---------- Shared text + cell styles ---------- */
    .m    { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .mo   { font-size: 10px; letter-spacing: 1px; fill: #5c5c5c; }
    rect.c { width: 11px; height: 11px; stroke-width: 1; }

    /* Contribution levels (0 = none ... 4 = most) */
    .l0 { fill: none;    stroke: #c4c4c4; }
    .l1 { fill: #b3b3b3; stroke: #b3b3b3; }
    .l2 { fill: #737373; stroke: #737373; }
    .l3 { fill: #3a3a3a; stroke: #3a3a3a; }
    .l4 { fill: #000000; stroke: #000000; }

    /* ---------- Animations ---------- */
    .cu { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink {
      0%, 50%      { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }

    .w { animation: scan 6s ease-in-out infinite; }
    @keyframes scan {
      0%, 30%, 100% { opacity: 1; }
      12%           { opacity: .25; }
    }
  </style>

