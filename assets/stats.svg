<svg xmlns="http://www.w3.org/2000/svg" width="400" height="230" viewBox="0 0 400 230" role="img" aria-label="GitHub stats">
  <title>GitHub stats</title>

  <style>
    /* ---------- Shared styles ---------- */
    .m  { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .lb { font-size: 11px; letter-spacing: 1px; fill: #5c5c5c; }                     /* row label */
    .v  { font-size: 14px; font-weight: 700; text-anchor: end; fill: #000000; }      /* row value */
    .ic {                                                                            /* row icon */
      fill: none;
      stroke: #000000;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---------- Animations ---------- */
    .cu { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink {
      0%, 50%      { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }

    .orb {
      transform-origin: 322px 140px;   /* ring center */
      animation: orbit 10s linear infinite;
    }
    @keyframes orbit {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- ========== Card: drop shadow + white body with border ========== -->
  <rect x="8" y="8" width="390" height="220" fill="#c4c4c4"/>
  <rect x="2" y="2" width="390" height="220" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- ========== Header ========== -->
  <text class="m" x="24" y="36" fill="#000000" font-size="13" font-weight="700" letter-spacing="2.5">KVRTRSS'S GITHUB STATS</text>
  <rect class="cu" x="252.6" y="25" width="8" height="13" fill="#000000"/>
  <line x1="24" y1="46" x2="368" y2="46" stroke="#5c5c5c" stroke-width="1"/>

  <!-- ========== Stat rows ========== -->

  <!-- Total stars -->
  <g class="ic" transform="translate(24,69)">
    <polygon points="7.00,0.50 8.76,5.07 13.66,5.34 9.85,8.43 11.11,13.16 7.00,10.50 2.89,13.16 4.15,8.43 0.34,5.34 5.24,5.07"/>
  </g>
  <text class="m lb" x="46" y="80">TOTAL STARS</text>
  <text class="m v" x="246" y="80">1</text>

  <!-- Total commits -->
  <g class="ic" transform="translate(24,97)">
    <circle cx="7" cy="7" r="6"/>
    <polyline points="7,3.5 7,7 10,8.5"/>
  </g>
  <text class="m lb" x="46" y="108">TOTAL COMMITS</text>
  <text class="m v" x="246" y="108">108</text>

  <!-- Total PRs -->
  <g class="ic" transform="translate(24,125)">
    <circle cx="3" cy="3" r="1.8"/>
    <circle cx="3" cy="11" r="1.8"/>
    <circle cx="11" cy="11" r="1.8"/>
    <line x1="3" y1="4.8" x2="3" y2="9.2"/>
    <polyline points="11,9.2 11,4 8,4"/>
  </g>
  <text class="m lb" x="46" y="136">TOTAL PRS</text>
  <text class="m v" x="246" y="136">32</text>

  <!-- Total issues -->
  <g class="ic" transform="translate(24,153)">
    <circle cx="7" cy="7" r="6"/>
    <line x1="7" y1="4" x2="7" y2="7.5"/>
    <circle cx="7" cy="9.8" r="0.5" fill="#000000"/>
  </g>
  <text class="m lb" x="46" y="164">TOTAL ISSUES</text>
  <text class="m v" x="246" y="164">5</text>

  <!-- Contributed to -->
  <g class="ic" transform="translate(24,181)">
    <rect x="2" y="1" width="10" height="12" rx="1"/>
    <line x1="2" y1="10" x2="12" y2="10"/>
  </g>
  <text class="m lb" x="46" y="192">CONTRIBUTED TO</text>
  <text class="m v" x="246" y="192">0</text>

  <!-- ========== Rank ring (center 322,140) ========== -->
  <!-- Outer dotted guide -->
  <circle cx="322" cy="140" r="46" fill="none" stroke="#5c5c5c" stroke-width="0.6" stroke-dasharray="1 4"/>
  <!-- Track -->
  <circle cx="322" cy="140" r="34" fill="none" stroke="#c4c4c4" stroke-width="6"/>
  <!-- Progress arc (starts at 12 o'clock) -->
  <circle cx="322" cy="140" r="34" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-dasharray="32.0 213.6" transform="rotate(-90 322 140)"/>
  <!-- Grade -->
  <text class="m" x="322" y="150" text-anchor="middle" fill="#000000" font-size="28" font-weight="700">C+</text>
  <!-- Orbiting dot -->
  <g class="orb">
    <circle cx="322" cy="94" r="3" fill="#000000"/>
  </g>
</svg>
