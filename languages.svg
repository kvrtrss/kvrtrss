    <rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#000000" stroke-width="2.5"/>
  </pattern>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="6" fill="#ffffff"/><circle cx="3" cy="3" r="1.7" fill="#000000"/>
  </pattern>
  <pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="6" fill="#ffffff"/>
    <line x1="0" y1="3" x2="6" y2="3" stroke="#000000" stroke-width="1.5"/>
    <line x1="3" y1="0" x2="3" y2="6" stroke="#000000" stroke-width="1.5"/>
  </pattern>
