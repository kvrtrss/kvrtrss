<svg xmlns="http://www.w3.org/2000/svg" width="400" height="230" viewBox="0 0 400 230" role="img" aria-label="Top languages"><title>Top languages</title><style>.cu{animation:blink 1.1s steps(1) infinite}@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}.bar{transform-box:fill-box;transform-origin:0 50%;animation:grow .9s ease-out backwards}@keyframes grow{from{transform:scaleX(0)}}</style>
<defs>
